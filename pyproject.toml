[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "restartable-spark-dag"
version = "0.3.0"
description = "A restartable notebook DAG reference runtime for Fabric and Databricks"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
cloud = ["azure-identity>=1.19,<2", "azure-storage-file-datalake>=12.18,<13", "databricks-sdk>=0.40,<1"]
test = ["ruff>=0.11,<1", "nbformat>=5.10,<6", "Pillow>=11,<13"]
animation = ["Pillow>=11,<13"]
browser-test = ["playwright>=1.51,<2"]
spark-test = ["pyspark==4.0.1", "delta-spark==4.0.0"]

[project.scripts]
spark-dag = "spark_dag.__main__:main"

[tool.setuptools.packages.find]
include = ["spark_dag*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
